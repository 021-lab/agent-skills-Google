name: Voice Notes Stable E2E Smoke Test

on:
  push:
  workflow_dispatch:

jobs:
  voice-notes-real-smoke:
    name: Deploy stable Voice Notes E2E site and run real smoke test
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VOICE_NOTES_E2E_TARGET: voice-notes-e2e
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Verify required secrets are present
        env:
          GCP_PRIVATE_KEY_JSON: ${{ secrets.GCP_PRIVATE_KEY_JSON }}
          E2E_GOOGLE_EMAIL: ${{ secrets.E2E_GOOGLE_EMAIL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          missing=()
          for name in \
            GCP_PRIVATE_KEY_JSON \
            E2E_GOOGLE_EMAIL \
            FIREBASE_WEB_API_KEY \
            FIREBASE_AUTH_DOMAIN \
            FIREBASE_PROJECT_ID \
            FIREBASE_STORAGE_BUCKET \
            FIREBASE_MESSAGING_SENDER_ID \
            FIREBASE_APP_ID
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions secrets:\n'
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Generate Voice Notes Firebase config
        env:
          E2E_GOOGLE_EMAIL: ${{ secrets.E2E_GOOGLE_EMAIL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cat > examples/voice-notes/firebase-config.js <<'CONFIG'
          import { createFirebaseAdapter, createGeminiAdapter, createDriveAdapter } from '/src/core/google-sdk.js';

          window.__voiceNotesBootstrap = { status: 'starting' };

          try {
            const firebaseConfig = {
              apiKey: '__FIREBASE_WEB_API_KEY__',
              authDomain: '__FIREBASE_AUTH_DOMAIN__',
              projectId: '__FIREBASE_PROJECT_ID__',
              storageBucket: '__FIREBASE_STORAGE_BUCKET__',
              messagingSenderId: '__FIREBASE_MESSAGING_SENDER_ID__',
              appId: '__FIREBASE_APP_ID__',
            };

            const ALLOWLIST = ['__E2E_GOOGLE_EMAIL__'.toLowerCase()];

            const { auth: firebaseAuth, firebaseApp } = await createFirebaseAdapter(firebaseConfig);
            const geminiClient = await createGeminiAdapter({ firebaseApp });
            const driveClient = createDriveAdapter(() => firebaseAuth.getAccessToken());

            window.__voiceNotesConfig = {
              firebase: { auth: firebaseAuth },
              allowlist: ALLOWLIST,
              geminiClient,
              driveClient,
              debug: true,
            };
            window.__voiceNotesBootstrap = { status: 'ready' };
          } catch (error) {
            window.__voiceNotesBootstrap = {
              status: 'error',
              message: error instanceof Error ? error.message : String(error),
            };
            throw error;
          }
          CONFIG

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'examples/voice-notes/firebase-config.js';
          const replacements = {
            __FIREBASE_WEB_API_KEY__: process.env.FIREBASE_WEB_API_KEY,
            __FIREBASE_AUTH_DOMAIN__: process.env.FIREBASE_AUTH_DOMAIN,
            __FIREBASE_PROJECT_ID__: process.env.FIREBASE_PROJECT_ID,
            __FIREBASE_STORAGE_BUCKET__: process.env.FIREBASE_STORAGE_BUCKET,
            __FIREBASE_MESSAGING_SENDER_ID__: process.env.FIREBASE_MESSAGING_SENDER_ID,
            __FIREBASE_APP_ID__: process.env.FIREBASE_APP_ID,
            __E2E_GOOGLE_EMAIL__: process.env.E2E_GOOGLE_EMAIL,
          };
          let content = fs.readFileSync(path, 'utf8');
          for (const [token, value] of Object.entries(replacements)) {
            content = content.replaceAll(token, String(value).replaceAll('\\', '\\\\').replaceAll("'", "\\'"));
          }
          fs.writeFileSync(path, content);
          NODE

      - name: Authenticate Firebase CLI
        env:
          GCP_PRIVATE_KEY_JSON: ${{ secrets.GCP_PRIVATE_KEY_JSON }}
        run: |
          printf '%s' "$GCP_PRIVATE_KEY_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Validate Firebase service account JSON
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8');
          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch (error) {
            throw new Error(`GCP_PRIVATE_KEY_JSON is not valid JSON: ${error.message}`);
          }
          for (const key of ['type', 'project_id', 'client_email', 'private_key']) {
            if (!parsed[key]) {
              throw new Error(`GCP_PRIVATE_KEY_JSON is missing required key: ${key}`);
            }
          }
          console.log(`service-account-project=${parsed.project_id}`);
          console.log(`service-account-client=${parsed.client_email}`);
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Verify Firebase CLI access
        run: firebase projects:list --json

      - name: Derive stable Voice Notes E2E site id
        id: site
        run: |
          site_id="$(node --input-type=module -e "import { resolveVoiceNotesE2ESiteId } from './scripts/voice-notes-e2e-config.mjs'; console.log(resolveVoiceNotesE2ESiteId(process.env.FIREBASE_PROJECT_ID));")"
          echo "site_id=$site_id" >> "$GITHUB_OUTPUT"
          echo "stable_url=https://$site_id.web.app/examples/voice-notes/index.html" >> "$GITHUB_OUTPUT"

      - name: Ensure stable Hosting site exists
        run: |
          set +e
          firebase hosting:sites:create "${{ steps.site.outputs.site_id }}" \
            --project "$FIREBASE_PROJECT_ID" \
            --debug
          create_status=$?
          set -e

          if [ "$create_status" -ne 0 ]; then
            echo "Hosting site create returned $create_status; continuing after listing existing sites."
          fi

          firebase hosting:sites:list --project "$FIREBASE_PROJECT_ID"

      - name: Bind stable Hosting target
        run: firebase target:apply hosting "$VOICE_NOTES_E2E_TARGET" "${{ steps.site.outputs.site_id }}" --project "$FIREBASE_PROJECT_ID"

      - name: Generate stable Hosting deploy config
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const hostingConfig = Array.isArray(source.hosting) ? source.hosting[0] : source.hosting;
          const e2eConfig = {
            ...source,
            hosting: [{
              ...hostingConfig,
              target: process.env.VOICE_NOTES_E2E_TARGET,
            }],
          };
          fs.writeFileSync('firebase.e2e.json', JSON.stringify(e2eConfig, null, 2));
          NODE

      - name: Deploy stable Voice Notes E2E site
        id: deploy
        run: |
          firebase deploy \
            --only "hosting:$VOICE_NOTES_E2E_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --config firebase.e2e.json \
            --debug \
            --json > "$RUNNER_TEMP/firebase-deploy.json"

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/firebase-deploy.json', 'utf8'));
          console.log(`stable_url=https://${process.env.SITE_ID}.web.app/examples/voice-notes/index.html`);
          console.log(`site_id=${process.env.SITE_ID}`);
          NODE
        env:
          SITE_ID: ${{ steps.site.outputs.site_id }}

      - name: Authorize stable Hosting domains for Firebase Auth
        run: |
          node scripts/update-firebase-auth-config.mjs \
            "$FIREBASE_PROJECT_ID" \
            "${{ steps.site.outputs.site_id }}.web.app" \
            "${{ steps.site.outputs.site_id }}.firebaseapp.com"

      - name: Publish stable E2E URL summary
        run: |
          {
            echo "### Voice Notes stable E2E site"
            echo
            echo "- Stable URL: ${{ steps.deploy.outputs.stable_url }}"
            echo "- Firebase Hosting site id: ${{ steps.site.outputs.site_id }}"
            echo "- Helper page in repo: \`docs/voice-notes-e2e-auth.html\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Playwright storage state
        env:
          E2E_PLAYWRIGHT_STORAGE_STATE_B64: ${{ secrets.E2E_PLAYWRIGHT_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$E2E_PLAYWRIGHT_STORAGE_STATE_B64" ]; then
            {
              echo "### Voice Notes E2E browser session is not configured"
              echo
              echo "- Stable auth URL: ${{ steps.deploy.outputs.stable_url }}"
              echo "- Save a session locally with \`FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID npm run e2e:auth:save\`"
              echo "- Upload it with \`npm run e2e:auth:upload-secret\`"
              echo "- Helper page in repo: \`docs/voice-notes-e2e-auth.html\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Missing GitHub secret E2E_PLAYWRIGHT_STORAGE_STATE_B64"
            exit 1
          fi

          mkdir -p playwright/.auth
          printf '%s' "$E2E_PLAYWRIGHT_STORAGE_STATE_B64" | base64 --decode > playwright/.auth/voice-notes-google.json

      - name: Run deployed Voice Notes real smoke test
        env:
          E2E_REAL: '1'
          E2E_BASE_URL: ${{ steps.deploy.outputs.stable_url }}
          E2E_GOOGLE_EMAIL: ${{ secrets.E2E_GOOGLE_EMAIL }}
          E2E_STORAGE_STATE_PATH: playwright/.auth/voice-notes-google.json
        run: npx playwright test tests/voice-notes.real.e2e.spec.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
