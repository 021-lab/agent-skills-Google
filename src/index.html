<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Web Framework</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    .status {
      background: rgba(255, 255, 255, 0.1);
      padding: 1.5rem;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      margin-top: 2rem;
    }

    .status-item {
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }

    .status-item.ready {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Voice Web Framework</h1>
    <p>Agent-supervised voice-controlled web applications</p>

    <div class="status">
      <div class="status-item">✓ Framework loaded</div>
      <div class="status-item">✓ Firebase ready</div>
      <div class="status-item ready">✓ Awaiting voice input...</div>
    </div>
  </div>

  <script type="module">
    import { VoiceApp } from './voiceframe.js';

    console.log('Voice Framework initialized');
    console.log('VoiceApp:', VoiceApp);

    // Initialize app when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        console.log('DOM ready, framework waiting for configuration');
      });
    } else {
      console.log('DOM ready, framework waiting for configuration');
    }
  </script>
</body>
</html>
